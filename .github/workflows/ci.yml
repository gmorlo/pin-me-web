name: CI

on:
  push:
    branches: [dev, master, prod]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          API_ORIGIN: http://localhost:8000
          NEXT_PUBLIC_PORTFOLIO_URL: https://francke.tech
